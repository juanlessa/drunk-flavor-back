services:
    app:
        build: .
        container_name: app
        ports:
            - '3333:3333'
        environment:
            - API_ENV=${API_ENV:-development}
            - MONGO_HOST=mongodb
            - MONGO_DATABASE=${MONGO_DATABASE}
            - MONGO_PARAMS=authMechanism=DEFAULT&authSource=admin&replicaSet=rs0
            - SMTP_HOST=mailpit
            - SMTP_PORT=1025
            - SMTP_USERNAME=
            - SMTP_PASSWORD=
        depends_on:
            mongodb:
                condition: service_healthy
            mailpit:
                condition: service_started
        networks:
            - node-network

    mongodb:
        image: mongodb/mongodb-atlas-local:7.0
        restart: always
        container_name: mongodb
        ports:
            - '27017:27017'
        environment:
            - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
            - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
            - MONGODB_INITDB_DATABASE=${MONGO_DATABASE}
        volumes:
            - dbdata6:/data/db
        networks:
            - node-network

    mailpit:
        image: axllent/mailpit:v1.31.3
        restart: unless-stopped
        container_name: mailpit
        ports:
            - '1025:1025'
            - '8025:8025'
        networks:
            - node-network

volumes:
    dbdata6:

networks:
    node-network:
        driver: bridge
