services:
    app:
        build: .
        container_name: app
        ports:
            - '3333:3333'
        environment:
            - API_ENV=${API_ENV:-development}
            - MONGO_HOST=mongodb
            - MONGO_DATABASE=${MONGO_DATABASE}
            - MONGO_PARAMS=authMechanism=DEFAULT&authSource=admin&replicaSet=rs0
            - REDIS_MODE=external
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_USERNAME=
            - REDIS_PASSWORD=
            - REDIS_DATABASE=0
            - BULLMQ_REDIS_HOST=redis
            - BULLMQ_REDIS_PORT=6379
            - BULLMQ_REDIS_USERNAME=
            - BULLMQ_REDIS_PASSWORD=
            - BULLMQ_REDIS_DATABASE=1
            - SMTP_HOST=mailpit
            - SMTP_PORT=1025
            - SMTP_USERNAME=
            - SMTP_PASSWORD=
        depends_on:
            mongodb:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
        networks:
            - node-network

    mongodb:
        image: mongodb/mongodb-atlas-local:8.3
        restart: always
        container_name: mongodb
        ports:
            - '27017:27017'
        environment:
            - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
            - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
            - MONGODB_INITDB_DATABASE=${MONGO_DATABASE}
        volumes:
            - dbdata6:/data/db
        networks:
            - node-network

    redis:
        image: redis:8
        restart: always
        container_name: redis
        # BullMQ requires maxmemory-policy=noeviction so queue keys are never
        # evicted. appendonly enables AOF persistence so queued jobs survive a
        # container restart. The cache (db 0) and the queue (db 1) share this
        # instance; without a maxmemory limit no eviction happens for either.
        command: redis-server --maxmemory-policy noeviction --appendonly yes
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - redisdata:/data
        networks:
            - node-network

    mailpit:
        image: axllent/mailpit:v1.31.6
        restart: unless-stopped
        container_name: mailpit
        ports:
            - '1025:1025'
            - '8025:8025'
        networks:
            - node-network

volumes:
    dbdata6:
    redisdata:

networks:
    node-network:
        driver: bridge
