name: secret scanning

on:
    push:
        branches:
            - 'releases/**'
            - 'main'
            - 'develop'
    pull_request:

jobs:
    gitleaks:
        runs-on: ubuntu-latest

        steps:
            - name: Git checkout
              uses: actions/checkout@v7
              with:
                  # Fetch full history so the scan covers every commit, not just the tip.
                  fetch-depth: 0

            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
