name: coverage report flow

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scoped to the minimum needed to post a coverage comment on the pull request.
permissions:
    contents: read
    pull-requests: write

jobs:
    report-coverage:
        name: merged coverage report (informational)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Renovate PRs only change dependencies. Skipped jobs report success, so this is safe for required checks.
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Merged unit + integration coverage
              continue-on-error: true
              run: npm run test:all:coverage

            - name: Report merged coverage on PR
              uses: davelosert/vitest-coverage-report-action@v2
              with:
                  name: 'Merged coverage (unit + integration)'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  vite-config-path: ./vitest.config.ts
                  json-summary-path: ./coverage/coverage-summary.json
                  json-final-path: ./coverage/coverage-final.json
                  # Only the totals table; per-file details made the comment exceed GitHub's size limit.
                  file-coverage-mode: none
