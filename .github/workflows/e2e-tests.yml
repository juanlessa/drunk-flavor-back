name: e2e testing flow

on:
    push:
        branches:
            - 'releases/**'
            - 'master'
            - 'develop'
    pull_request:
        branches:
            - 'releases/**'
            - 'master'
            - 'develop'

jobs:
    run-tests:
        runs-on: ubuntu-latest

        services:
            mailpit:
                image: axllent/mailpit:v1.31.3
                env:
                    MP_DISABLE_VERSION_CHECK: 'true'
                    MP_SMTP_DISABLE_RDNS: 'true'
                ports:
                    - 1025:1025
                    - 8025:8025

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                  mongodb-version: '7.0'
                  mongodb-username: ${{ secrets.MONGO_USERNAME }}
                  mongodb-password: ${{ secrets.MONGO_PASSWORD }}
                  mongodb-db: ${{ secrets.MONGO_DATABASE }}
                  mongodb-replica-set: rs0
                  mongodb-key: ${{ secrets.MONGO_REPLICA_SET_KEY }}

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: |
                  npm run generate-secret-key
                  npm run test:e2e:run
              env:
                  LOGGER_ENABLED: false
                  MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
                  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
                  MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
                  MONGO_HOST: 'localhost'
                  MONGO_PORT: '27017'
                  MONGO_PARAMS: 'authMechanism=DEFAULT&authSource=admin&replicaSet=rs0'
                  MONGO_MODE: 'external'
                  SMTP_DOMAIN: 'drunkflavor.com'
                  SMTP_HOST: 'localhost'
                  SMTP_PORT: '1025'
                  SMTP_USERNAME: ''
                  SMTP_PASSWORD: ''
