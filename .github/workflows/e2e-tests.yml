name: e2e testing flow

on:
    push:
        branches:
            - 'releases/**'
            - 'main'
            - 'develop'
    pull_request:
        branches:
            - 'releases/**'
            - 'main'
            - 'develop'

jobs:
    run-tests:
        runs-on: ubuntu-latest

        services:
            mailpit:
                image: axllent/mailpit:v1.31.5
                env:
                    MP_DISABLE_VERSION_CHECK: 'true'
                    MP_SMTP_DISABLE_RDNS: 'true'
                ports:
                    - 1025:1025
                    - 8025:8025

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                  mongodb-version: '7.0'
                  mongodb-replica-set: rs0

            - name: Create and verify MongoDB test user
              env:
                  MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
                  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
                  MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
              run: |
                  set -euo pipefail

                  [ -n "${MONGO_USERNAME:-}" ] || { echo '::error::MONGO_USERNAME secret is empty'; exit 1; }
                  [ -n "${MONGO_PASSWORD:-}" ] || { echo '::error::MONGO_PASSWORD secret is empty'; exit 1; }
                  [ -n "${MONGO_DATABASE:-}" ] || { echo '::error::MONGO_DATABASE secret is empty'; exit 1; }

                  echo 'MongoDB configuration: mode=external host=localhost port=27017 database=set username=set password=set authSource=admin replicaSet=rs0'

                  docker exec --env MONGO_USERNAME --env MONGO_PASSWORD mongodb mongosh --quiet --eval '
                    const admin = db.getSiblingDB("admin");
                    admin.createUser({
                      user: process.env.MONGO_USERNAME,
                      pwd: process.env.MONGO_PASSWORD,
                      roles: [{ role: "root", db: "admin" }],
                    });
                  ' >/dev/null

                  docker exec --env MONGO_USERNAME --env MONGO_PASSWORD --env MONGO_DATABASE mongodb mongosh --quiet --eval '
                    const username = encodeURIComponent(process.env.MONGO_USERNAME);
                    const password = encodeURIComponent(process.env.MONGO_PASSWORD);
                    const database = encodeURIComponent(process.env.MONGO_DATABASE);
                    const uri = `mongodb://${username}:${password}@localhost:27017/${database}?authSource=admin&replicaSet=rs0`;
                    const connection = new Mongo(uri);
                    const ping = connection.getDB(process.env.MONGO_DATABASE).runCommand({ ping: 1 });
                    if (ping.ok !== 1) throw new Error("MongoDB authenticated ping failed");
                  ' >/dev/null

                  echo 'MongoDB authenticated ping succeeded'

            - name: Start Redis
              uses: supercharge/redis-github-action@1.8.1
              with:
                  redis-version: '7'
                  redis-port: '6379'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: |
                  npm run generate-secret-key
                  npm run test:e2e:run
              env:
                  LOGGER_ENABLED: false
                  MONGO_MODE: 'external'
                  MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
                  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
                  MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
                  MONGO_HOST: 'localhost'
                  MONGO_PORT: '27017'
                  MONGO_PARAMS: 'authMechanism=DEFAULT&authSource=admin&replicaSet=rs0'
                  REDIS_MODE: 'external'
                  REDIS_HOST: 'localhost'
                  REDIS_PORT: '6379'
                  REDIS_USERNAME: ''
                  REDIS_PASSWORD: ''
                  REDIS_DATABASE: '0'
                  SMTP_DOMAIN: 'drunkflavor.com'
                  SMTP_HOST: 'localhost'
                  SMTP_PORT: '1025'
                  SMTP_USERNAME: ''
                  SMTP_PASSWORD: ''
