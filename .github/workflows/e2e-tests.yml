name: e2e testing flow

on:
    push:
        branches:
            - 'releases/**'
            - 'master'
            - 'develop'
    pull_request:
        branches:
            - 'releases/**'
            - 'master'
            - 'develop'

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Git checkout
              uses: actions/checkout@v6

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'

            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                  mongodb-version: '7.0'
                  mongodb-username: ${{ secrets.MONGO_USERNAME }}
                  mongodb-password: ${{ secrets.MONGO_PASSWORD }}
                  mongodb-db: ${{ secrets.MONGO_DATABASE }}

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: |
                  npm run generate-secret-key
                  npm run test:e2e:setup
                  npm run test:e2e
              env:
                  LOGGER_ENABLED: false
                  MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
                  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
                  MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
                  MONGO_HOST: 'localhost'
                  MONGO_PORT: '27017'
                  MONGO_PARAMS: 'authMechanism=DEFAULT&authSource=admin'
                  MONGO_PERSISTENCE_MODE: 'inDisk'
